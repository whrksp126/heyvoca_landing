services:
  landing:
    build: .
    container_name: heyvoca_landing
    image: whrksp126/heyvoca_landing:prod
    restart: always
    networks:
      - nginx_proxy
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"

networks:
  nginx_proxy:
    external: true
    name: nginx_proxy
